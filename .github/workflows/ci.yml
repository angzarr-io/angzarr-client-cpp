name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [protos-updated]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential protobuf-compiler \
            libprotobuf-dev libgrpc++-dev libgtest-dev libgmock-dev \
            protobuf-compiler-grpc

      - name: Build
        run: just -f justfile.container build

      - name: Test
        run: just -f justfile.container test
